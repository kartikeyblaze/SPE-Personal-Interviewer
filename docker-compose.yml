version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - backend-nw
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    build: ./services/auth
    container_name: auth-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017/auth_db
      - JWT_SECRET=${JWT_SECRET}
      - PORT=5001
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend-nw
    restart: on_failure

  interview-service:
    build: ./services/interview
    container_name: interview-service
    environment:
      - MONGO_URI=mongodb://mongodb:27017/interview_db
      - JWT_SECRET=${JWT_SECRET}
      - API_KEY_GEMINI=${API_KEY_GEMINI}
      - PORT=5002
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend-nw
    restart: on_failure

  frontend-service:
    build: ./services/frontend
    container_name: frontend-service
    depends_on:
      - auth-service
      - interview-service
    networks:
      - frontend-nw
    restart: on_failure

  gateway:
    image: nginx:latest
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend-service
      - auth-service
      - interview-service
    networks:
      - frontend-nw
      - backend-nw

networks:
  frontend-nw:
  backend-nw:

volumes:
  mongo-data:
