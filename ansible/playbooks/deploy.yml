---
- name: Deploy Microservices to Minikube
  hosts: localhost
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vault.yml
  
  tasks:
    - name: Apply Application Secrets
      no_log: true
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: app-secrets
            namespace: default
          type: Opaque
          stringData:
            jwt-secret: "{{ vault_jwt_secret }}"
            groq-api-key: "{{ vault_groq_api_key }}"

    - name: Apply MongoDB Manifest
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/base/mongodb.yaml') | from_yaml_all | list }}"

    - name: Apply Auth Service Manifest
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', '../../k8s/base/auth-deployment.yaml.j2') }}"
    
    - name: Apply Interview Service Manifest
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', '../../k8s/base/interview-deployment.yaml.j2') }}"

    - name: Apply Frontend Service Manifest
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', '../../k8s/base/frontend-deployment.yaml.j2') }}"

    - name: Apply Ingress Manifest
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/base/ingress.yaml') | from_yaml }}"

    - name: Apply Auth HPA Manifest
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/base/auth-hpa.yaml') | from_yaml }}"

    - name: Apply Interview HPA Manifest
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/base/interview-hpa.yaml') | from_yaml }}"

    - name: Apply Logging Namespace
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/logging/namespace.yaml') | from_yaml }}"

    - name: Apply Loki Config
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/logging/loki-configmap.yaml') | from_yaml }}"

    - name: Apply Loki Service
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/logging/loki-service.yaml') | from_yaml }}"

    - name: Apply Loki StatefulSet
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/logging/loki-statefulset.yaml') | from_yaml }}"

    - name: Apply Promtail Config
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/logging/promtail-configmap.yaml') | from_yaml }}"

    - name: Apply Promtail ServiceAccount
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/logging/promtail-serviceaccount.yaml') | from_yaml }}"

    - name: Apply Promtail ClusterRole
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/logging/promtail-clusterrole.yaml') | from_yaml }}"

    - name: Apply Promtail ClusterRoleBinding
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/logging/promtail-clusterrolebinding.yaml') | from_yaml }}"

    - name: Apply Promtail DaemonSet
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/logging/promtail-daemonset.yaml') | from_yaml }}"

    - name: Apply Grafana Datasources
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/logging/grafana-configmap.yaml') | from_yaml }}"

    - name: Apply Grafana Service
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/logging/grafana-service.yaml') | from_yaml }}"

    - name: Apply Grafana Deployment
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', '../../k8s/logging/grafana-deployment.yaml') | from_yaml }}"

    - name: Wait for MongoDB rollout
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: mongodb
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 180

    - name: Wait for Auth Service rollout
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: auth-service
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 180

    - name: Wait for Interview Service rollout
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: interview-service
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 180

    - name: Wait for Frontend Service rollout
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: frontend-service
        wait: true
        wait_condition:
          type: Available
          status: "True"
        wait_timeout: 180
